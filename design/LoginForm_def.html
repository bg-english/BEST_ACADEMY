<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BEST Academy - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background: radial-gradient(circle at center, #1a1f30 0%, #0e1323 100%);
            overflow: hidden;
        }
        .glass-card {
            background: rgba(11, 16, 32, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(93, 230, 255, 0.3);
        }
        .glow-cyan:hover {
            box-shadow: 0 0 30px rgba(93, 230, 255, 0.5);
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .pin-input:focus {
            box-shadow: 0 0 0 2px #5de6ff, 0 0 15px rgba(93, 230, 255, 0.4);
        }
        /* Custom scrollbar for name picker */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#121f00",
                        "surface-container": "#1a1f30",
                        "on-primary-container": "#ede0ff",
                        "on-primary-fixed": "#25005a",
                        "inverse-surface": "#dee1f9",
                        "surface-container-low": "#161b2b",
                        "background": "#0e1323",
                        "surface-dim": "#0e1323",
                        "on-primary": "#3f008e",
                        "secondary-fixed-dim": "#2fd9f4",
                        "primary-container": "#7c3aed",
                        "on-secondary-container": "#00515d",
                        "on-tertiary-container": "#b6fb49",
                        "on-background": "#dee1f9",
                        "on-tertiary": "#213600",
                        "on-surface": "#dee1f9",
                        "tertiary": "#98da27",
                        "primary": "#d2bbff",
                        "on-secondary-fixed-variant": "#004e5a",
                        "primary-fixed-dim": "#d2bbff",
                        "surface-container-high": "#25293a",
                        "tertiary-container": "#4b7200",
                        "inverse-primary": "#732ee4",
                        "surface-tint": "#d2bbff",
                        "secondary": "#5de6ff",
                        "primary-fixed": "#eaddff",
                        "surface-bright": "#34394a",
                        "on-secondary": "#00363e",
                        "on-surface-variant": "#ccc3d8",
                        "error-container": "#93000a",
                        "secondary-container": "#00cbe6",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "surface-variant": "#2f3446",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed": "#b2f746",
                        "secondary-fixed": "#a2eeff",
                        "inverse-on-surface": "#2b3041",
                        "on-primary-fixed-variant": "#5a00c6",
                        "tertiary-fixed-dim": "#98da27",
                        "outline": "#958da1",
                        "surface": "#0e1323",
                        "surface-container-lowest": "#080d1d",
                        "outline-variant": "#4a4455",
                        "surface-container-highest": "#2f3446",
                        "on-secondary-fixed": "#001f25",
                        "on-tertiary-fixed-variant": "#334f00"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "stat-label": ["Plus Jakarta Sans"],
                        "headline-md": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "button-text": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "stat-label": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "button-text": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen text-on-surface relative">
<!-- Starry Background -->
<div class="absolute inset-0 pointer-events-none z-0" id="stars-container"></div>
<main class="relative z-10 w-full max-w-md px-margin-edge">
<!-- Central Login Card -->
<div class="glass-card rounded-[2rem] p-10 flex flex-col items-center shadow-2xl">
<!-- Brand Identity -->
<div class="mb-10 text-center">
<div class="flex items-center justify-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<h1 class="font-headline-md text-headline-md font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
                        BEST Academy
                    </h1>
</div>
<p class="font-body-md text-on-surface-variant">Inicia sesión en tu aventura</p>
</div>
<!-- Form Fields -->
<div class="w-full space-y-6">
<!-- Name Picker Dropdown -->
<div class="space-y-2">
<label class="font-stat-label text-stat-label text-on-surface-variant uppercase ml-1">Selecciona tu nombre</label>
<div class="relative group">
<select class="w-full bg-surface-container-lowest/50 border border-outline-variant/30 text-on-surface rounded-xl px-4 py-4 appearance-none focus:outline-none focus:border-secondary transition-all font-body-lg text-body-lg cursor-pointer">
<option disabled="" selected="" value="">Elige un estudiante...</option>
<option value="1">Alejandro G. 🌟</option>
<option value="2">Martina R. 🛸</option>
<option value="3">Sofía L. 🌌</option>
<option value="4">Leo M. ☄️</option>
<option value="5">Valentina P. 🚀</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<!-- 4-Digit PIN Input -->
<div class="space-y-2">
<label class="font-stat-label text-stat-label text-on-surface-variant uppercase ml-1">Introduce tu PIN</label>
<div class="flex justify-between gap-3" id="pin-container">
<input class="pin-input w-14 h-16 text-center text-3xl font-headline-md bg-surface-container-lowest/50 border border-outline-variant/30 rounded-xl focus:border-secondary focus:outline-none transition-all text-secondary" maxlength="1" type="password"/>
<input class="pin-input w-14 h-16 text-center text-3xl font-headline-md bg-surface-container-lowest/50 border border-outline-variant/30 rounded-xl focus:border-secondary focus:outline-none transition-all text-secondary" maxlength="1" type="password"/>
<input class="pin-input w-14 h-16 text-center text-3xl font-headline-md bg-surface-container-lowest/50 border border-outline-variant/30 rounded-xl focus:border-secondary focus:outline-none transition-all text-secondary" maxlength="1" type="password"/>
<input class="pin-input w-14 h-16 text-center text-3xl font-headline-md bg-surface-container-lowest/50 border border-outline-variant/30 rounded-xl focus:border-secondary focus:outline-none transition-all text-secondary" maxlength="1" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-8 group relative overflow-hidden bg-gradient-to-r from-primary to-secondary p-[2px] rounded-xl hover:scale-[1.02] active:scale-95 transition-all duration-200 glow-cyan">
<div class="bg-surface-container-lowest group-hover:bg-transparent transition-colors rounded-[10px] py-4 flex items-center justify-center gap-2">
<span class="font-button-text text-button-text text-secondary group-hover:text-surface-container-lowest transition-colors uppercase tracking-widest">¡A aprender! 🚀</span>
</div>
</button>
</div>
<!-- Footer Links -->
<div class="mt-12 flex flex-col items-center gap-4">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-lg">school</span>
                    Soy Profesor/a
                </a>
<div class="h-1 w-12 bg-outline-variant/20 rounded-full"></div>
<p class="text-[12px] font-stat-label text-outline/50 uppercase tracking-[0.2em]">Academy Protocol 2.4.0</p>
</div>
</div>
</main>
<!-- Decorative Corner Element -->
<div class="fixed bottom-0 right-0 p-8 opacity-20 pointer-events-none hidden md:block">
<span class="material-symbols-outlined text-[120px] text-secondary/30" style="font-variation-settings: 'FILL' 1;">hub</span>
</div>
<script>
        // Star generation script
        const starsContainer = document.getElementById('stars-container');
        const starCount = 100;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 5}s`);
            star.style.opacity = Math.random();
            starsContainer.appendChild(star);
        }

        // Auto-focus PIN inputs
        const inputs = document.querySelectorAll('#pin-container input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple login interaction simulation
        document.querySelector('button').addEventListener('click', () => {
            const buttonContent = document.querySelector('button div span');
            buttonContent.textContent = "Conectando...";
            setTimeout(() => {
                buttonContent.textContent = "¡Bienvenido!";
                document.querySelector('.glass-card').style.transform = 'scale(1.05) translateY(-20px)';
                document.querySelector('.glass-card').style.opacity = '0';
                document.querySelector('.glass-card').style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            }, 800);
        });
    </script>
</body></html>
