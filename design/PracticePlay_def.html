</div>
</div>

                        Siguiente
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>

<script>
        function handleAnswer(element, isCorrect) {
            // Reset others
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-tertiary', 'ring-error', 'bg-tertiary/10', 'bg-error/10');
            });

            if (isCorrect) {
                element.classList.add('ring-2', 'ring-tertiary', 'bg-tertiary/5');
                element.querySelector('.material-symbols-outlined').textContent = 'check_circle';
                element.querySelector('.material-symbols-outlined').classList.add('text-tertiary');
                element.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                showFeedback();
            } else {
                element.classList.add('ring-2', 'ring-error', 'bg-error/5');
                element.querySelector('.material-symbols-outlined').textContent = 'cancel';
                element.querySelector('.material-symbols-outlined').classList.add('text-error');
                element.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            }
        }

        function showFeedback() {
            const panel = document.getElementById('feedbackPanel');
            panel.classList.remove('hidden');
        }

        // Timer Logic
        let seconds = 45;
        const timerEl = document.getElementById('timer');
        setInterval(() => {
            if (seconds > 0) {
                seconds--;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
